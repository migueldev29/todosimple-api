<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="js/updateTask.js"></script>
  <script src="js/toast.js"></script>

  <style>
    body {
      background-color: #252525;
      font-family: 'Poppins', sans-serif;
    }

    .btn-custom {
      background-color: #6200ea;
      color: white;

      border-radius: 8px;
      font-size: 16px;
      width: 100%;
      transition: transform 0.2s ease-in-out;
    }

    .btn-custom:hover {
      background-color: #3700b3;
      color: white;
    }

    textarea {
      font-family: Candara;
      font-size: 15pt !important;
      height: 300px;
    }
  </style>
</head>

<body>
  <div class="vh-100 d-flex justify-content-center align-items-center">
    <div class="container">
      <div class="row d-flex justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-lg">
            <div class="card-body p-5">
              <form class="mb-3 mt-md-4">
                <h2 class="fw-bold mb-2 text-uppercase text-center">
                  Atualizar atividade
                </h2>
                <p class="mb-4 text-center">
                  Por favor, insira a nova descrição da atividade.
                </p>
                <div class="mb-3">
                  <label class="form-label">Descrição</label>
                  <textarea type="text" class="form-control" placeholder="Nova descrição" required="true"
                    id="description" maxlength="1000"></textarea>
                </div>
                <div class="d-grid mb-2">
                  <button type="button" id="requestBtn" class="btn btn-custom" onclick="updateTask()">
                    Atualizar
                  </button>
                </div>

                <div class="d-grid">
                  <button type="button" class="btn btn-danger" onclick="window.location.href = 'index.html'">
                    Voltar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
