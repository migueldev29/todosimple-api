<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastre-se</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="scripts/toast.js"></script>
  <script src="scripts/signup.js"></script>
  <!-- 
      Créditos: https://frontendshape.com/post/bootstrap-5-login-form-page-example
    -->
  <link rel="stylesheet" href="styles/form.css">
</head>

<body>
  <div class="glass-card">
    <h2 class="mb-3"><strong>Cadastre-se</strong></h2>
    <p class="mb-4">Por favor, insira seu nome de usuário e senha para criar sua conta!</p>
    <form>
      <div class="mb-3">
        <input type="text" class="form-control" id="username" placeholder="Nome de usuário" required />
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" placeholder="Senha" required />
      </div>
      <button class="btn btn-custom" type="button" onclick="signup()">Cadastrar</button>
    </form>
    <p class="mt-3">Já tem uma conta? <a href="login.html">Entrar</a></p>
  </div>

</body>

</html>
