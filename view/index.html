<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Atividades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="styles/sidebar.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>

<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2 class="text-center mb-4"><strong>Gerenciador de Atividades</strong></h2>
      <button class="btn btn-custom mb-3" onclick="window.location = '/view/task.html'">
        <i class="bi bi-plus-lg"></i> Adicionar
      </button>
      <button class="btn btn-danger"
        onclick="localStorage.removeItem('Authorization'); window.location = '/view/login.html'">
        <i class="bi bi-box-arrow-right"></i> Sair
      </button>
    </div>

    <!-- Main Content -->
    <div class="content">
      <h1 class="text-center mb-4">Suas atividades</h1>

      <!-- Loading Spinner -->
      <div class="d-flex justify-content-center">
        <div class="spinner-border" role="status" id="loading"></div>
      </div>

      <table id="taskList" class="table table-hover table-dark">
        <tbody id="tasks"></tbody>
      </table>
    </div>

  </div>
  <script src="./scripts/script.js"></script>
  <script src="./scripts/deleteTask.js"></script>
  <script src="./scripts/toast.js"></script>
</body>

</html>
